[project]
name = "todo"
version = "0.1.0"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
start = "todo.app:main"
test = "todo.scripts:test"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
